name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install --only-binary :all: --require-hashes -r requirements-ci.lock

      - name: Rodar testes
        working-directory: backend
        run: pytest --cov
